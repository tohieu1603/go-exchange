version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "../internal/adapter/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.numeric"
            go_type: "float64"
          # closed_at is nullable (open positions have no close time): force a
          # pointer so a NULL scans to nil rather than failing the time.Time scan.
          - column: "futures_positions.closed_at"
            go_type:
              type: "time.Time"
              pointer: true
